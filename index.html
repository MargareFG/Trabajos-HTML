<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Mi Bitácora Personal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <h1>Mi Bitácora Personal</h1>
        <p>Espacio personal de aprendizajes y notas diarias</p>
    </header>

    <main class="content-container">
        <section class="auth-section">
            <h2>ACCESO A LECTORES</h2>
            <p>¡REGÍSTRATE HUMANO! PARA CONOCER INFORMACIÓN PERSONAL SOBRE MÍ Y MI VIDA PERSONAL XD</p>
            
            <form action="principal.html">
                <div class="input-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" placeholder="usuario@correo.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" placeholder="****" required>
                </div>

                <button type="submit">Ingresar / Registrarse</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 - Creado por Paxzie Pat'z | Proyecto Autodidacta</p>
    </footer>

</body>
</html>
